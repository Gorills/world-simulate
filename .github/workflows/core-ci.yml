name: core-ci

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "WorldSimulate.sln"
      - "Directory.Build.props"
      - "global.json"
      - ".github/workflows/core-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CI: "true"
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.423"
      - name: Restore
        run: dotnet restore WorldSimulate.sln
      - name: Build
        run: dotnet build WorldSimulate.sln --configuration Release --no-restore
      - name: Core tests
        run: dotnet test tests/Mws.Core.Tests/Mws.Core.Tests.csproj --configuration Release --no-build --no-restore --logger "console;verbosity=minimal"
      - name: Architecture tests
        run: dotnet test tests/Mws.Architecture.Tests/Mws.Architecture.Tests.csproj --configuration Release --no-build --no-restore --logger "console;verbosity=minimal"
