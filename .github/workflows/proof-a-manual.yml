name: proof-a-manual

on:
  workflow_dispatch:
    inputs:
      steps:
        description: "Simulation steps for the bounded Proof A benchmark"
        required: false
        default: "1000000"

permissions:
  contents: read

concurrency:
  group: proof-a-manual
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CI: "true"
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.423"
      - name: Run bounded benchmark
        run: dotnet run --configuration Release --project benchmarks/Mws.Benchmarks/Mws.Benchmarks.csproj -- "${{ inputs.steps }}"
