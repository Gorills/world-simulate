name: godot-smoke

on:
  pull_request:
    branches: [main]
    paths:
      - "src/Mws.Client.Godot/**"
      - "src/Mws.Simulation.Runtime/**"
      - "src/Mws.Simulation.Api/**"
      - "src/Mws.Domain/**"
      - "Directory.Build.props"
      - "global.json"
      - ".github/workflows/godot-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.1"
  GODOT_ARCHIVE: "Godot_v4.7.1-stable_mono_linux_x86_64.zip"
  GODOT_SHA256: "6ca7ff0459f1b806900be683c1b0837c607a9c16834c530dc68c81b9fc3ae1f6"

jobs:
  headless-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: "true"
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.423"
      - name: Restore Godot project
        run: dotnet restore src/Mws.Client.Godot/Mws.Client.Godot.csproj
      - name: Build Godot C# project
        run: dotnet build src/Mws.Client.Godot/Mws.Client.Godot.csproj --configuration Debug --no-restore
      - name: Cache Godot editor
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: .ci/godot/${{ env.GODOT_VERSION }}
          key: godot-${{ runner.os }}-${{ env.GODOT_VERSION }}-mono-x86_64-${{ env.GODOT_SHA256 }}
      - name: Download verified Godot .NET editor
        if: steps.godot-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ".ci/godot/${GODOT_VERSION}"
          curl --fail --location --retry 2 \
            --output "${RUNNER_TEMP}/${GODOT_ARCHIVE}" \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/${GODOT_ARCHIVE}"
          echo "${GODOT_SHA256}  ${RUNNER_TEMP}/${GODOT_ARCHIVE}" | sha256sum --check -
          unzip -q "${RUNNER_TEMP}/${GODOT_ARCHIVE}" -d ".ci/godot/${GODOT_VERSION}"
      - name: Resolve Godot binary
        shell: bash
        run: |
          set -euo pipefail
          GODOT_BIN="$(find ".ci/godot/${GODOT_VERSION}" -type f -name 'Godot_v4.7.1-stable_mono_linux.x86_64' -print -quit)"
          test -n "${GODOT_BIN}"
          chmod +x "${GODOT_BIN}"
          echo "GODOT_BIN=${GODOT_BIN}" >> "${GITHUB_ENV}"
      - name: Headless integration smoke
        shell: bash
        run: |
          set -euo pipefail
          "${GODOT_BIN}" --headless --path src/Mws.Client.Godot --quit-after 120 2>&1 | tee godot-smoke.log
          grep -q "MWS_GODOT_SMOKE_OK" godot-smoke.log
